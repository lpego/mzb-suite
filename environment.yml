name: mzbsuite
channels:
  - conda-forge
  - nodefaults
channel_priority: strict

dependencies:
  - python=3.10
  - numpy=1.25
  - pandas=2.0
  - pytorch=2.0
  - torchvision=0.15
  - cpuonly
  # - pytorch-cuda=11.8
  - pytorch-lightning=2.0
  - matplotlib=3.7
  - scikit-learn=1.2
  - scikit-image=0.21
  - ipython=8.12
  - ipykernel=6.25
  - scipy=1.11
  - pip

  - pip:
    - pyyaml==6.0
    - wandb==0.15.8
    - opencv-python==4.8.0.76
    - segmentation_models_pytorch==0.3.3
    - tensorboard==2.13.0
    - tensorboardX==2.6.2
    # - sphinx==6.2.1
    # - sphinx-collections==0.0.1
    # - sphinx-rtd-theme==1.2.2
    # - nbsphinx==0.9.2
    - -e .